# ===================================================================
# E2E Construction Management System - Common Application Configuration
# Production-ready, 12-factor configuration using environment variables
# ===================================================================

spring.application.name=e2e-construction-management

# Active profile: defaults to 'local' for local development.
# Render and Docker container will set SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Port configuration: listens on Render's dynamic PORT, fallback to SERVER_PORT, then 8080
server.port=${PORT:${SERVER_PORT:8080}}

# ===================================================================
# Reverse Proxy & HTTPS Forward Headers (Cloudflare, Nginx, ALB, Render, etc.)
# ===================================================================
server.forward-headers-strategy=framework

# ===================================================================
# Connection Pool (HikariCP)
# ===================================================================
spring.datasource.hikari.pool-name=ConstructionHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ===================================================================
# Common Spring Data JPA Settings
# ===================================================================
spring.jpa.open-in-view=false

# ===================================================================
# JWT (JSON Web Token) Configuration
# Set JWT_SECRET in production environment (minimum 256 bits)
# ===================================================================
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CORS (Cross-Origin Resource Sharing) Configuration
# Restricts API access to authorized frontend origins.
# Provide comma-separated origins via APP_CORS_ALLOWED_ORIGINS or FRONTEND_URL.
# ===================================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500}}

# ===================================================================
# File Upload Configuration (Machinery Images & Documents)
# Use persistent storage path via FILE_UPLOAD_DIR in production
# ===================================================================
file.upload-dir=${FILE_UPLOAD_DIR:uploads/machinery}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
