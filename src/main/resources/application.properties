# ===================================================================
# E2E Construction Management System - Application Configuration
# Production-ready, 12-factor configuration using environment variables
# ===================================================================

spring.application.name=e2e-construction-management
server.port=${PORT:${SERVER_PORT:8080}}

# ===================================================================
# Reverse Proxy & HTTPS Forward Headers (Cloudflare, Nginx, ALB, Render, etc.)
# ===================================================================
server.forward-headers-strategy=framework

# ===================================================================
# MySQL Database Configuration
# Configurable via Environment Variables:
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD, DB_USE_SSL, DB_URL
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/E2E?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:${LOCAL_DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.pool-name=ConstructionHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ===================================================================
# Spring Data JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===================================================================
# JWT (JSON Web Token) Configuration
# Set JWT_SECRET in production environment (minimum 256 bits)
# ===================================================================
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CORS (Cross-Origin Resource Sharing) Configuration
# Restricts API access to authorized frontend origins.
# Provide comma-separated origins via APP_CORS_ALLOWED_ORIGINS or FRONTEND_URL.
# ===================================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500}}

# ===================================================================
# File Upload Configuration (Machinery Images & Documents)
# Use persistent storage path via FILE_UPLOAD_DIR in production
# ===================================================================
file.upload-dir=${FILE_UPLOAD_DIR:uploads/machinery}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
