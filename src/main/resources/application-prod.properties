# ===================================================================
# Production Profile for Render / Cloud (application-prod.properties)
# Fails fast on startup if required database variables are not set.
# Never silently falls back to localhost or default credentials.
# ===================================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Safe production JPA / Hibernate settings (non-destructive)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
