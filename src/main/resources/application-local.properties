# ===================================================================
# Local Development Profile (application-local.properties)
# Connects to local MySQL with configurable credentials.
# ===================================================================

spring.datasource.url=${LOCAL_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/E2E?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}}
spring.datasource.username=${LOCAL_DB_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${LOCAL_DB_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate for Local Development
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
